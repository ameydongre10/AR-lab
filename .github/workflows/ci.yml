name: CI - AR-Lab Quality & Test Automation

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  logic-and-simulation-tests:
    name: Simulation & Logic Validation (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Test Suite
        run: dotnet run --project .github/workflows/support/CiRunner.csproj

  unity-tests:
    name: Unity Test Framework (EditMode & PlayMode)
    runs-on: ubuntu-latest
    needs: logic-and-simulation-tests
    if: github.repository_owner == 'ameydongre10' && false # Enable when Unity license secrets (UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD) are configured in GitHub Secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity-${{ hashFiles('Packages/manifest.json') }}

      - name: Run EditMode and PlayMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: artifacts
          unityVersion: 6000.0.32f1
